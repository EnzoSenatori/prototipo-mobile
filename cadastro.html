<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/button.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/page.css" />
    <link rel="stylesheet" href="css/form.css" />
    <link rel="stylesheet" href="css/nav.css" />

</head>

<body>
    <div class="page">
        <header class="page__section">
            <h1>Cadastre-se</h1>
            <p>Preencha suas informações abaixo</p>
        </header>

        <main>
            <form class="form page__section">
                <div class="form__field">
                    <label class="form__label" for="nome">Insira seu nome</label>
                    <input class="form__input" type="text" id="nome" placeholder="Nome" />
                </div>
                <div class="form__field">
                    <label class="form__label" for="sobrenome">Insira seu sobrenome</label>
                    <input class="form__input" type="text" id="sobrenome" placeholder="Sobrenome" />
                </div>
                <div class="form__field">
                    <label class="form__label" for="email">Insira seu e-mail</label>
                    <input class="form__input" type="email" id="email" placeholder="E-mail" />
                </div>
                <div class="form__field">
                    <label class="form__label" for="celular">Insira seu celular</label>
                    <input class="form__input" type="tel" id="celular" placeholder="Celular" />
                </div>
                <div class="form__field">
                    <label class="form__label" for="senha">Insira sua senha</label>
                    <input class="form__input" type="password" id="senha" placeholder="Senha" />
                </div>
                <div class="form__field">
                    <label class="form__label" for="senha-confirmar">Confirme sua senha</label>
                    <input class="form__input" type="password" id="senha-confirmar" placeholder="Confirme sua senha" />
                </div>

                <a class="button button--primary" href="index.html">Criar conta</a>
                <a class="button button--secondary" href="login.html">Já tenho uma conta</a>
            </form>
        </main>

        <nav class="nav">
            <a class="nav__item" href="index.html">Início</a>
            <a class="nav__item" href="login.html">Entrar</a>
            <a class="nav__item nav__item--active" href="cadastro.html">Cadastro</a>
        </nav>
    </div>
</body>

</html>
