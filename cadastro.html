<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/button.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/page.css" />
    <link rel="stylesheet" href="css/form.css" />
</head>

<body>
    <div class="page">
        <header class="page__section">
            <h1>Cadastre-se</h1>
            <p>Preencha suas informações abaixo</p>
        </header>

        <main>
            <form class="form page__section">
                <div class="form__field">
                    <!-- <label class="form__label" for="nome">Insira seu nome</label> -->
                    <input class="form__input" type="nome" id="nome" placeholder="Nome"/>
                    <input class="form__input" type="sobrenome" id="sobrenome" placeholder="Sobrenome"/>
                    <input class="form__input" type="email" id="email" placeholder="E-mail"/>
                    <input class="form__input" type="celular" id="celular" placeholder="Celular"/>
                </div>
                <a class="button button--primary" href="index.html">Entrar</a>
            </form>
        </main>

    </div>
</body>

</html>
