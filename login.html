<!DOCTYPE html>

<body>

                    <label class="form__label" for="senha">Senha</label>
                    <input class="form__input" type="password" id="senha" />

                <a class="button button--primary" href="index.html">Entrar</a>
                <a class="button button--secondary" href="cadastro.html">Criar conta</a>
